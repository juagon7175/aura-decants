<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA DECANTS | Alta Perfumería Fraccionada</title>
    
    <!-- FAVICON, MANIFEST E ÍCONO PARA CELULARES -->
    <meta name="theme-color" content="#09090B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AURA Decants">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/jpeg" href="hero-aura.jpeg">
    <link rel="apple-touch-icon" href="hero-aura.jpeg">

    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Syne:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. VARIABLES DE PALETA (AURA DARK LUXURY)
           ========================================= */
        :root {
            --bg-obsidian: #09090B;
            --bg-glass: rgba(18, 18, 22, 0.84);
            --bg-card: rgba(18, 18, 22, 0.88);
            --bg-card-hover: rgba(24, 24, 30, 0.95);
            --border-subtle: rgba(255, 255, 255, 0.09);
            --border-hover: rgba(255, 255, 255, 0.26);
            
            --text-silver: #F4F4F6;
            --text-smoke: #9CA3AF;
            --text-muted: #6B7280;
            
            --accent-chrome: linear-gradient(135deg, #FFFFFF 0%, #A1A1AA 100%);
            --radius-pill: 999px;
            --radius-soft: 22px;
            --radius-card: 18px;
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* =========================================
           2. RESET Y ESTILOS BASE
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-silver);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.55;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* =========================================
           EFECTO DE HUMO / VAPOR SUTIL EN MOVIMIENTO
           ========================================= */
        .smoke-ambient {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }

        .smoke-plume {
            position: absolute;
            border-radius: 50%;
            filter: blur(95px);
            opacity: 0.55;
            will-change: transform;
        }

        .smoke-1 {
            width: 55vw;
            height: 55vw;
            max-width: 750px;
            max-height: 750px;
            top: -10%;
            left: -10%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.065) 0%, rgba(161, 161, 170, 0.02) 50%, transparent 75%);
            animation: driftSmoke1 24s infinite alternate ease-in-out;
        }

        .smoke-2 {
            width: 60vw;
            height: 60vw;
            max-width: 820px;
            max-height: 820px;
            top: 30%;
            right: -15%;
            background: radial-gradient(circle, rgba(228, 228, 231, 0.055) 0%, rgba(113, 113, 122, 0.02) 55%, transparent 75%);
            animation: driftSmoke2 30s infinite alternate ease-in-out;
        }

        .smoke-3 {
            width: 50vw;
            height: 50vw;
            max-width: 700px;
            max-height: 700px;
            bottom: -15%;
            left: 20%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(156, 163, 175, 0.015) 50%, transparent 75%);
            animation: driftSmoke3 27s infinite alternate ease-in-out;
        }

        @keyframes driftSmoke1 {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(12vw, 8vh) scale(1.15) rotate(12deg); }
            100% { transform: translate(5vw, 18vh) scale(0.95) rotate(-8deg); }
        }

        @keyframes driftSmoke2 {
            0% { transform: translate(0, 0) scale(1.05); }
            50% { transform: translate(-15vw, -10vh) scale(1.2); }
            100% { transform: translate(-8vw, 12vh) scale(0.9); }
        }

        @keyframes driftSmoke3 {
            0% { transform: translate(0, 0) scale(0.95); }
            50% { transform: translate(14vw, -14vh) scale(1.18); }
            100% { transform: translate(-10vw, -6vh) scale(1.05); }
        }

        /* =========================================
           3. BARRA DE NAVEGACIÓN CON ISOTIPO "A"
           ========================================= */
        .navbar {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            max-width: 1240px;
            z-index: 1000;
            background: var(--bg-glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-pill);
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition-smooth);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-silver);
        }

        .brand-logo-svg {
            width: 30px;
            height: 30px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.15));
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            line-height: 1;
        }

        .brand-sub {
            font-size: 0.52rem;
            letter-spacing: 0.4em;
            color: var(--text-smoke);
            margin-top: 3px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-smoke);
            font-size: 0.78rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: var(--transition-smooth);
        }

        .nav-links a:hover {
            color: var(--text-silver);
        }

        .cart-trigger {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-subtle);
            color: var(--text-silver);
            padding: 8px 18px;
            border-radius: var(--radius-pill);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition-smooth);
        }

        .cart-trigger:hover {
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.12);
        }

        .cart-badge {
            background: var(--text-silver);
            color: var(--bg-obsidian);
            font-size: 0.68rem;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: var(--radius-pill);
        }

        /* =========================================
           4. HERO SECTION (PORTADA COMPACTA)
           ========================================= */
        .hero {
            max-width: 1240px;
            margin: 0 auto;
            padding: 100px 24px 36px;
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            align-items: center;
            gap: 36px;
            position: relative;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-smoke);
            margin-bottom: 18px;
        }

        .hero-tag span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #E4E4E7;
            box-shadow: 0 0 8px #FFFFFF;
        }

        .hero-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2.1rem, 4vw, 3.3rem);
            font-weight: 600;
            line-height: 1.12;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
            background: linear-gradient(180deg, #FFFFFF 20%, #9CA3AF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-description {
            font-size: 0.96rem;
            font-weight: 300;
            color: var(--text-smoke);
            max-width: 520px;
            margin-bottom: 26px;
            line-height: 1.65;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .btn-primary {
            background: var(--accent-chrome);
            color: var(--bg-obsidian);
            text-decoration: none;
            padding: 13px 28px;
            border-radius: var(--radius-pill);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: var(--transition-smooth);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.08);
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.16);
        }

        .btn-secondary {
            color: var(--text-silver);
            text-decoration: none;
            padding: 13px 24px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-subtle);
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: var(--transition-smooth);
        }

        .btn-secondary:hover {
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.04);
        }

        .hero-visual {
            position: relative;
            border-radius: var(--radius-soft);
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            aspect-ratio: 16 / 13;
            max-height: 360px;
            width: 100%;
        }

        .hero-visual img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hero-visual:hover img {
            transform: scale(1.03);
        }

        .hero-visual::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg-obsidian) 0%, transparent 25%);
            pointer-events: none;
        }

        /* =========================================
           5. CATÁLOGO DE DECANTS (GRILLA DENSA Y SIN HUECOS)
           ========================================= */
        .section-container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .section-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .section-eyebrow {
            font-size: 0.7rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--text-smoke);
            margin-bottom: 6px;
            display: block;
        }

        .section-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.6rem, 2.8vw, 2.2rem);
            font-weight: 600;
            color: var(--text-silver);
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
        }

        .filter-btn {
            background: rgba(18, 18, 22, 0.6);
            border: 1px solid var(--border-subtle);
            color: var(--text-smoke);
            padding: 8px 18px;
            border-radius: var(--radius-pill);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.76rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--border-hover);
            color: var(--text-silver);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-card);
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition-smooth);
            position: relative;
        }

        .product-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-3px);
        }

        .product-card.fully-out {
            opacity: 0.65;
        }

        .product-img-box {
            width: 100%;
            height: 180px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 14px;
            background: #121216;
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
            mix-blend-mode: luminosity;
            filter: contrast(1.15) brightness(0.95);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .product-card:hover .product-img-box img {
            transform: scale(1.06);
            mix-blend-mode: normal;
            filter: none;
        }

        .stock-badge-out {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #EF4444;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .product-house {
            font-size: 0.66rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-smoke);
            margin-bottom: 4px;
        }

        .product-name {
            font-family: 'Syne', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-silver);
            margin-bottom: 10px;
        }

        .product-notes {
            font-size: 0.78rem;
            color: var(--text-smoke);
            font-weight: 300;
            line-height: 1.5;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .product-notes strong {
            color: var(--text-silver);
            font-weight: 500;
        }

        .size-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .size-option {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 8px 6px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            color: var(--text-smoke);
        }

        .size-option.selected {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text-silver);
            color: var(--text-silver);
        }

        .size-option.out-stock {
            opacity: 0.4;
            cursor: not-allowed;
